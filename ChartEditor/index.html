<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Rhythm Game Chart Editor</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* =========================
   ツールバー
========================= */

#toolbar {
    height: 64px;
    background: #222;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid #444;
}

#toolbar input,
#toolbar select {
    background: #333;
    color: white;
    border: 1px solid #555;
    padding: 6px;
}

button {
    background: #444;
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 4px;
    cursor: pointer;
}

button:hover {
    background: #666;
}

button.active {
    background: #268cff;
}

/* =========================
   エディタ
========================= */

#editorWrapper {
    height: calc(100vh - 64px);
    overflow: auto;
    position: relative;
}

#timeline {
    position: relative;
    width: 600px;
    margin-left: 100px;
    background: #1b1b1b;
    /* タイムライン全体を上下反転させ、奥から手前に流れるようにする */
    transform: scaleY(-1);
}

/* 反転によって逆さになった文字やラベルを元に戻す */
.timeLabel,
.bpmChangeLabel,
.note,
.slide-line,
.slide-point {
    transform: scaleY(-1);
}

/* 小節線・拍線・レーン線 */

.measureLine {
    position: absolute;
    left: 0;
    height: 2px;
    background: #777;
    z-index: 2;
}

.beatLine {
    position: absolute;
    left: 0;
    height: 1px;
    background: #333;
    z-index: 1;
}

.laneLine {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: #444;
    z-index: 1;
}

.timeLabel {
    position: absolute;
    left: -90px;
    width: 80px;
    text-align: right;
    color: #888;
    font-size: 12px;
}

.bpmChangeLine {
    position: absolute;
    left: 0;
    height: 3px;
    background: #ff9d3d;
    z-index: 3;
}

.bpmChangeLabel {
    position: absolute;
    right: -140px;
    width: 130px;
    text-align: left;
    color: #ff9d3d;
    font-size: 11px;
    cursor: pointer;
    background: rgba(0,0,0,0.6);
    padding: 2px 4px;
    border-radius: 3px;
    z-index: 15;
}
.bpmChangeLabel:hover {
    background: #ff9d3d;
    color: black;
}

.gridSubLine {
    position: absolute;
    left: 0;
    height: 1px;
    background: #222;
    z-index: 1;
}

/* =========================
   共通ノーツ
========================= */

.note {
    position: absolute;
    z-index: 10;
    cursor: pointer;
}

/* TAP */
.note-tap {
    height: 24px;
    border-radius: 5px;
    background: #ff3535;
    border: 2px solid white;
}

/* EX */
.note-ex {
    height: 24px;
    border-radius: 5px;
    background: #ffd83d;
    border: 3px solid #fff;
    box-shadow: 0 0 10px #ffd83d, 0 0 20px #ffd83d;
}

/* HOLD */
.note-hold {
    background: #ff9100;
    border: 2px solid white;
    border-radius: 8px;
}

/* FLICK */
.note-flick {
    height: 24px;
    border-radius: 5px;
    background: #00e1ff;
    border: 3px solid white;
}

/* DRAG */
.note-drag {
    height: 12px;
    border-radius: 5px;
    background: #ff3535;
    border: 2px solid white;
}

/* SLIDE */
.slide-line {
    position: absolute;
    height: 8px;
    background: #0084ff;
    border-radius: 8px;
    transform-origin: 0 50%;
    z-index: 5;
}

.slide-point {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid rgb(0, 38, 255);
    z-index: 12;
}

/* SKY */
.note-sky {
    height: 12px;
    border-radius: 5px;
    background: #4400ff;
    border: 3px solid white;
    box-shadow: 0 0 10px #824dff, 0 0 30px #824dff;
}

/* =========================
   設定パネル
========================= */

#propertyPanel {
    position: fixed;
    right: 0;
    top: 64px;
    width: 260px;
    bottom: 0;
    background: #202020;
    border-left: 1px solid #444;
    padding: 15px;
    overflow-y: auto;
}

#propertyPanel h3 {
    margin-top: 0;
}

.property {
    margin-bottom: 12px;
}

.property label {
    display: block;
    color: #aaa;
    margin-bottom: 4px;
}

.property input,
.property select {
    width: 100%;
    background: #333;
    color: white;
    border: 1px solid #555;
    padding: 7px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<!-- =========================
    ツールバー
========================= -->

<div id="toolbar">
    <label>
        曲名
        <input id="songName" value="MySong">
    </label>

    <label>
        BPM
        <input id="bpm" type="number" value="120" style="width: 60px;">
    </label>

    <label>
        変更後BPM
        <input id="newBpmInput" type="number" value="180" style="width: 60px;">
    </label>
    <button onclick="addBpmChangeAtCurrent()">BPM変更追加</button>

    <label>
        拍子
    </label>
    <div style="display: inline-flex; align-items: center; gap: 2px;">
        <input id="timeNumerator" type="number" value="4" min="1" max="32" style="width: 40px; text-align: center;">
        <span>/</span>
        <select id="timeDenominator" style="width: 55px;">
            <option value="2">2</option>
            <option value="4" selected>4</option>
            <option value="8">8</option>
            <option value="16">16</option>
            <option value="32">32</option>
        </select>
    </div>

    <label>
        グリッド
        <select id="gridDivision" style="width: 65px;">
            <option value="4" selected>4分</option>
            <option value="8">8分</option>
            <option value="16">16分</option>
            <option value="32">32分</option>
        </select>
    </label>

   <!-- 新しく追加：音声ファイル選択 ＆ 曲の長さ自動取得 -->
    <label>
        音源ファイル
        <input id="audioFileInput" type="file" accept="audio/*" style="width: 140px;">
    </label>

    <!-- 内部データ維持用の隠しinput（JavaScriptから値を書き込むためidを残します） -->
    <input id="songMinutes" type="hidden" value="2">
    <input id="songSeconds" type="hidden" value="0">
    <audio id="bgmPlayer" style="display: none;"></audio>

    <label>
        レーン
        <select id="laneCount">
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8" selected>8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
        </select>
    </label>

    <div id="noteButtons"></div>

    <button onclick="setMode('delete')">削除</button>
    <button onclick="saveJSON()">JSON保存</button>
    <button onclick="loadJSON()">JSON読み込み</button>

    <input id="fileInput" type="file" accept=".json" style="display:none">
</div>

<!-- =========================
    タイムライン
========================= -->

<div id="editorWrapper">
    <div id="timeline"></div>
</div>

<!-- =========================
    プロパティ
========================= -->

<div id="propertyPanel">
    <h3>ノーツ設定</h3>
    <div id="properties">ノーツを選択してください。</div>
</div>
<script src="js/editor.js"></script>
</body>
</html>
